[project]
name = "career-copilot-backend"
version = "0.1.0"
description = "AI Career Copilot backend scaffold for career platform"
authors = ["AI Career Platform <noreply@example.com>"]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: API",
]

dependencies = [
    "fastapi>=0.111.1",
    "uvicorn[standard]>=0.23.2",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.6",
    "sqlmodel>=0.0.8",
    "psycopg[binary]>=3.1.0",
    "python-dotenv>=1.0.0",
    "email-validator>=1.3.1",
    "requests>=2.31.0",
]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"
